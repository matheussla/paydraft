services:
  mongodb:
    image: mongo:8.0
    container_name: paydraft-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: paydraft
      MONGO_INITDB_ROOT_PASSWORD: paydraft_dev_password
      MONGO_INITDB_DATABASE: paydraft
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
